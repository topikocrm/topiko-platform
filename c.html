<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, rgb(199, 210, 254) 0%, rgb(224, 231, 255) 100%);
        }
        .loading-container {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f4f6;
            border-top: 4px solid #a855f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            color: #1e293b;
            margin-bottom: 0.5rem;
        }
        p {
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <h2>Redirecting...</h2>
        <p>Please wait while we redirect you to your destination.</p>
    </div>

    <!-- Include Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // Initialize Supabase
        const SUPABASE_URL = 'https://xssbtsfjtwjholygdbqo.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhzc2J0c2ZqdHdqaG9seWdkYnFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTMxOTk5MjUsImV4cCI6MjA2ODc3NTkyNX0.eOSIHTpvllcH-fK6MARoe5HPiXlujsrzUWfAhmUh94k';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Short URL redirect handler
        // This handles URLs like: topiko.app/c.html?code=ABC123 or topiko.app/c/ABC123
        
        // Get short code from URL (support both query param and path)
        let shortCode = null;
        const urlParams = new URLSearchParams(window.location.search);
        shortCode = urlParams.get('code');
        
        // If no code in query params, check if it's in the path (for clean URLs)
        if (!shortCode) {
            const pathParts = window.location.pathname.split('/');
            if (pathParts.includes('c') && pathParts.length > pathParts.indexOf('c') + 1) {
                shortCode = pathParts[pathParts.indexOf('c') + 1];
            }
        }
        
        if (shortCode) {
            // Fetch URL mapping from Supabase and redirect
            fetchAndRedirect(shortCode);
        } else {
            // No code provided, redirect to homepage
            window.location.href = '/lead-form.html';
        }
        
        async function fetchAndRedirect(code) {
            try {
                // Fetch the URL mapping from Supabase
                const { data, error } = await supabase
                    .from('short_urls')
                    .select('long_url, clicks')
                    .eq('short_code', code)
                    .eq('is_active', true)
                    .single();
                
                if (error || !data) {
                    console.error('Short URL not found:', error);
                    // Redirect to homepage if not found
                    setTimeout(() => {
                        window.location.href = '/lead-form.html';
                    }, 1000);
                    return;
                }
                
                // Track the click
                await trackClick(code);
                
                // Redirect to destination
                setTimeout(() => {
                    window.location.href = data.long_url;
                }, 500); // Small delay to show loading animation
                
            } catch (error) {
                console.error('Error fetching short URL:', error);
                // Redirect to homepage on error
                setTimeout(() => {
                    window.location.href = '/lead-form.html';
                }, 1000);
            }
        }
        
        async function trackClick(code) {
            try {
                // Increment click count in Supabase
                const { data: currentData } = await supabase
                    .from('short_urls')
                    .select('clicks')
                    .eq('short_code', code)
                    .single();
                
                if (currentData) {
                    const newClicks = (currentData.clicks || 0) + 1;
                    
                    await supabase
                        .from('short_urls')
                        .update({ 
                            clicks: newClicks,
                            last_clicked: new Date().toISOString()
                        })
                        .eq('short_code', code);
                    
                    console.log('Click tracked for short code:', code);
                }
            } catch (error) {
                console.error('Error tracking click:', error);
                // Don't block redirect if tracking fails
            }
        }
    </script>
</body>
</html>
