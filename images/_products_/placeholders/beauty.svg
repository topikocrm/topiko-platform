<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#fff0f9"/>
  <g transform="translate(200, 200)">
    <!-- Mirror circle -->
    <circle cx="0" cy="-20" r="50" fill="#fbbf24" opacity="0.3"/>
    <circle cx="0" cy="-20" r="45" fill="#fff" opacity="0.9"/>
    <circle cx="0" cy="-20" r="40" fill="#e0e7ff"/>
    <!-- Mirror sparkles -->
    <path d="M-20 -30 L-15 -25 L-20 -20 L-25 -25 Z" fill="#fbbf24"/>
    <path d="M20 -10 L23 -7 L20 -4 L17 -7 Z" fill="#fbbf24"/>
    <!-- Lipstick -->
    <rect x="-8" y="20" width="16" height="40" rx="2" fill="#6366f1"/>
    <rect x="-6" y="10" width="12" height="15" rx="2" fill="#ef4444"/>
    <rect x="-4" y="5" width="8" height="8" rx="4" fill="#dc2626"/>
    <!-- Brush -->
    <rect x="25" y="25" width="8" height="30" fill="#1e293b"/>
    <path d="M25 20 Q29 10, 29 5 Q29 10, 33 20 Z" fill="#8b5cf6"/>
  </g>
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#6366f1">Beauty</text>
</svg>