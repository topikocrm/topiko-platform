<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#f8fafc"/>
  <g transform="translate(200, 200)">
    <!-- Package box -->
    <path d="M-50 -20 L0 -40 L50 -20 L50 40 L0 60 L-50 40 Z" fill="#6366f1" opacity="0.9"/>
    <!-- Box top -->
    <path d="M-50 -20 L0 0 L50 -20 L0 -40 Z" fill="#8b5cf6"/>
    <!-- Box front -->
    <path d="M-50 -20 L-50 40 L0 60 L0 0 Z" fill="#6366f1" opacity="0.8"/>
    <!-- Box right -->
    <path d="M0 0 L0 60 L50 40 L50 -20 Z" fill="#4f46e5" opacity="0.8"/>
    <!-- Tape on box -->
    <path d="M-50 -20 L0 0 L50 -20" stroke="#fbbf24" stroke-width="4" fill="none"/>
    <path d="M0 -40 L0 0" stroke="#fbbf24" stroke-width="4" fill="none"/>
    <!-- Label on box -->
    <rect x="-20" y="10" width="40" height="20" fill="#fff" opacity="0.9"/>
    <rect x="-15" y="15" width="30" height="3" fill="#e5e7eb"/>
    <rect x="-15" y="22" width="20" height="3" fill="#e5e7eb"/>
  </g>
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#6366f1">Product</text>
</svg>