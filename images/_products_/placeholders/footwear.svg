<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#fef3f0"/>
  <g transform="translate(200, 200)">
    <!-- Shoe sole -->
    <ellipse cx="0" cy="30" rx="70" ry="20" fill="#1e293b" opacity="0.9"/>
    <!-- Shoe body -->
    <path d="M-60 30 Q-65 10, -50 -10 Q-30 -20, 0 -20 Q30 -20, 50 -10 Q65 10, 60 30 Z" fill="#6366f1"/>
    <path d="M-55 25 Q-58 8, -45 -5 Q-28 -15, 0 -15 Q28 -15, 45 -5 Q58 8, 55 25 Z" fill="#8b5cf6"/>
    <!-- Laces -->
    <circle cx="-20" cy="-5" r="3" fill="#fbbf24"/>
    <circle cx="-10" cy="-8" r="3" fill="#fbbf24"/>
    <circle cx="0" cy="-10" r="3" fill="#fbbf24"/>
    <circle cx="10" cy="-8" r="3" fill="#fbbf24"/>
    <circle cx="20" cy="-5" r="3" fill="#fbbf24"/>
    <!-- Lace line -->
    <path d="M-20 -5 L-10 -8 L0 -10 L10 -8 L20 -5" stroke="#fbbf24" stroke-width="2" fill="none"/>
    <!-- Brand stripe -->
    <rect x="-50" y="5" width="100" height="8" fill="#fbbf24" opacity="0.7"/>
  </g>
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#6366f1">Footwear</text>
</svg>