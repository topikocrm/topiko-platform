<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#fef6f0"/>
  <g transform="translate(200, 200)">
    <!-- Chair back -->
    <rect x="-40" y="-60" width="80" height="50" rx="4" fill="#6366f1" opacity="0.9"/>
    <rect x="-35" y="-55" width="70" height="40" rx="3" fill="#8b5cf6" opacity="0.8"/>
    <!-- Vertical slats -->
    <rect x="-25" y="-50" width="8" height="30" fill="#6366f1" opacity="0.7"/>
    <rect x="-8" y="-50" width="8" height="30" fill="#6366f1" opacity="0.7"/>
    <rect x="9" y="-50" width="8" height="30" fill="#6366f1" opacity="0.7"/>
    <!-- Seat -->
    <path d="M-45 -10 L-40 10 L40 10 L45 -10 Z" fill="#fbbf24"/>
    <path d="M-40 -5 L-35 8 L35 8 L40 -5 Z" fill="#f59e0b" opacity="0.8"/>
    <!-- Chair legs -->
    <rect x="-38" y="10" width="8" height="40" fill="#1e293b"/>
    <rect x="30" y="10" width="8" height="40" fill="#1e293b"/>
    <rect x="-38" y="-10" width="8" height="20" fill="#1e293b"/>
    <rect x="30" y="-10" width="8" height="20" fill="#1e293b"/>
    <!-- Cushion detail -->
    <ellipse cx="0" cy="0" rx="30" ry="5" fill="#fff" opacity="0.3"/>
  </g>
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#6366f1">Furniture</text>
</svg>