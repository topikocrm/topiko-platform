<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#fef9f0"/>
  <g transform="translate(200, 200)">
    <!-- Handbag body -->
    <path d="M-50 0 Q-50 40, -45 50 L45 50 Q50 40, 50 0 Z" fill="#6366f1" opacity="0.9"/>
    <path d="M-45 5 Q-45 40, -40 45 L40 45 Q45 40, 45 5 Z" fill="#8b5cf6" opacity="0.8"/>
    <!-- Handle -->
    <path d="M-30 0 Q-35 -30, -25 -40 Q-15 -45, 0 -45 Q15 -45, 25 -40 Q35 -30, 30 0" 
          stroke="#1e293b" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Buckle/Decoration -->
    <rect x="-15" y="15" width="30" height="20" rx="3" fill="#fbbf24"/>
    <rect x="-10" y="20" width="20" height="10" rx="2" fill="#f59e0b"/>
    <!-- Stitching detail -->
    <path d="M-40 10 L40 10" stroke="#fff" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
    <path d="M-40 40 L40 40" stroke="#fff" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  </g>
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#6366f1">Accessories</text>
</svg>