<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#f0f9ff"/>
  <g transform="translate(200, 200)">
    <!-- Phone/Device Body -->
    <rect x="-40" y="-60" width="80" height="120" rx="8" fill="#6366f1" opacity="0.9"/>
    <rect x="-35" y="-55" width="70" height="110" rx="6" fill="#1e293b"/>
    <!-- Screen -->
    <rect x="-30" y="-45" width="60" height="80" rx="2" fill="#8b5cf6"/>
    <!-- Screen content -->
    <rect x="-25" y="-40" width="50" height="15" fill="#fbbf24" opacity="0.8"/>
    <rect x="-25" y="-20" width="30" height="8" fill="#fff" opacity="0.6"/>
    <rect x="-25" y="-8" width="40" height="8" fill="#fff" opacity="0.6"/>
    <rect x="-25" y="4" width="35" height="8" fill="#fff" opacity="0.6"/>
    <!-- Home button -->
    <circle cx="0" cy="45" r="8" fill="#475569"/>
    <!-- Speaker -->
    <rect x="-15" y="-52" width="30" height="2" rx="1" fill="#64748b"/>
  </g>
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#6366f1">Electronics</text>
</svg>