<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#fff9e6"/>
  <g transform="translate(200, 200)">
    <!-- Plate -->
    <ellipse cx="0" cy="20" rx="80" ry="15" fill="#e5e7eb"/>
    <ellipse cx="0" cy="15" rx="75" ry="20" fill="#f3f4f6"/>
    <!-- Bowl of food -->
    <path d="M-50 -10 Q-50 30, 0 40 Q50 30, 50 -10 Z" fill="#fbbf24" opacity="0.9"/>
    <path d="M-45 -5 Q-45 25, 0 35 Q45 25, 45 -5 Z" fill="#f59e0b" opacity="0.8"/>
    <!-- Steam lines -->
    <path d="M-20 -20 Q-22 -30, -20 -40" stroke="#6366f1" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M0 -20 Q-2 -30, 0 -40" stroke="#6366f1" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M20 -20 Q22 -30, 20 -40" stroke="#6366f1" stroke-width="2" fill="none" opacity="0.6"/>
    <!-- Rice/food texture -->
    <circle cx="-10" cy="5" r="3" fill="#fff"/>
    <circle cx="10" cy="5" r="3" fill="#fff"/>
    <circle cx="0" cy="10" r="3" fill="#fff"/>
    <circle cx="-15" cy="15" r="3" fill="#fff"/>
    <circle cx="15" cy="15" r="3" fill="#fff"/>
  </g>
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#f59e0b">Food</text>
</svg>