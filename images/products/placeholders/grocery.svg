<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#f0fff4"/>
  <g transform="translate(200, 200)">
    <!-- Shopping bag -->
    <path d="M-40 -10 L-35 60 L35 60 L40 -10 Z" fill="#6366f1" opacity="0.9"/>
    <path d="M-35 -5 L-30 55 L30 55 L35 -5 Z" fill="#8b5cf6" opacity="0.8"/>
    <!-- Bag handles -->
    <path d="M-20 -10 Q-20 -25, -15 -30 Q-10 -35, 0 -35 Q10 -35, 15 -30 Q20 -25, 20 -10" 
          stroke="#1e293b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Groceries inside -->
    <!-- Apple -->
    <circle cx="-10" cy="20" r="12" fill="#ef4444" opacity="0.8"/>
    <path d="M-10 8 Q-10 5, -8 3" stroke="#10b981" stroke-width="2" fill="none"/>
    <!-- Carrot -->
    <path d="M10 15 L12 35 L14 35 L16 15 Z" fill="#f97316"/>
    <path d="M13 12 Q13 10, 15 8" stroke="#10b981" stroke-width="2" fill="none"/>
    <!-- Bread -->
    <rect x="-5" y="30" width="15" height="20" rx="4" fill="#fbbf24" opacity="0.8"/>
    <!-- Lines on bag -->
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#fff">FRESH</text>
  </g>
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="#6366f1">Grocery</text>
</svg>