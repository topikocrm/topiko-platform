<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Translation Test</title>
</head>
<body>
    <h1>Direct Translation Test</h1>
    <p>Open the browser console to see the results</p>
    
    <script src="translations.js"></script>
    
    <script>
        console.log('=== DIRECT TRANSLATION TEST ===');
        console.log('1. Checking if TopikoTranslations exists:', typeof window.TopikoTranslations);
        
        setTimeout(() => {
            console.log('2. After 100ms:', typeof window.TopikoTranslations);
            if (window.TopikoTranslations) {
                console.log('3. TopikoTranslations properties:', Object.keys(window.TopikoTranslations));
                console.log('4. TRANSLATIONS available:', !!window.TopikoTranslations.TRANSLATIONS);
                console.log('5. Languages available:', window.TopikoTranslations.TRANSLATIONS ? Object.keys(window.TopikoTranslations.TRANSLATIONS) : 'N/A');
            }
        }, 100);
        
        setTimeout(() => {
            console.log('6. After 500ms:', typeof window.TopikoTranslations);
        }, 500);
        
        // Check immediately
        if (window.TopikoTranslations) {
            console.log('✅ TopikoTranslations loaded immediately!');
        } else {
            console.log('❌ TopikoTranslations NOT loaded immediately');
        }
    </script>
</body>
</html>
