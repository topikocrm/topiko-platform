<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Selection Fix Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        .language-option {
            display: inline-block;
            padding: 1rem 2rem;
            margin: 0.5rem;
            background: #f3f4f6;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .language-option:hover {
            background: #e5e7eb;
        }
        .language-option.selected {
            background: #6366f1;
            color: white;
            border-color: #4f46e5;
        }
        .test-element {
            margin: 1rem 0;
            padding: 1rem;
            background: #f9fafb;
            border-radius: 4px;
        }
        .console-output {
            background: #1f2937;
            color: #10b981;
            padding: 1rem;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.875rem;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 2rem;
        }
        .status {
            padding: 0.5rem 1rem;
            border-radius: 4px;
            margin: 1rem 0;
        }
        .status.success {
            background: #d1fae5;
            color: #047857;
        }
        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <h1>🔧 Language Selection Fix Test</h1>
    
    <div class="status" id="status">Testing translation system...</div>
    
    <h2>Click to Test Language Selection:</h2>
    <div class="language-option" onclick="testLanguageSelection('en', this)">
        <h3>English</h3>
        <p>Continue in English</p>
    </div>
    <div class="language-option" onclick="testLanguageSelection('hi', this)">
        <h3>हिन्दी</h3>
        <p>हिन्दी में जारी रखें</p>
    </div>
    <div class="language-option" onclick="testLanguageSelection('ta', this)">
        <h3>தமிழ்</h3>
        <p>தமிழில் தொடரவும்</p>
    </div>
    
    <h2>Test Elements:</h2>
    <div class="test-element" data-translate="welcome.tagline">Welcome tagline will appear here</div>
    <div class="test-element" data-translate="welcome.tryFreeButton">Try free button text</div>
    <div class="test-element" data-translate="goals.title">Goals title</div>
    
    <div class="console-output" id="console">
        <pre id="log">Console output will appear here...</pre>
    </div>
    
    <script src="translations.js"></script>
    
    <script>
        const logElement = document.getElementById('log');
        const statusElement = document.getElementById('status');
        let logContent = [];
        
        function log(message) {
            console.log(message);
            logContent.push(message);
            logElement.textContent = logContent.join('\n');
        }
        
        function testLanguageSelection(lang, element) {
            log(`\n========== Testing ${lang} ==========`);
            
            // Method 1: Try using the global function directly
            if (typeof selectLanguageWithTranslation === 'function') {
                log('✅ Found global selectLanguageWithTranslation');
                try {
                    selectLanguageWithTranslation(lang, element);
                    log('✅ Called selectLanguageWithTranslation successfully');
                } catch (error) {
                    log(`❌ Error calling selectLanguageWithTranslation: ${error.message}`);
                }
            } else {
                log('❌ selectLanguageWithTranslation not found globally');
            }
            
            // Method 2: Try using TopikoTranslations directly
            if (window.TopikoTranslations) {
                log('✅ Found TopikoTranslations');
                
                // Try the function from TopikoTranslations
                if (window.TopikoTranslations.selectLanguageWithTranslation) {
                    log('✅ Found TopikoTranslations.selectLanguageWithTranslation');
                    try {
                        window.TopikoTranslations.selectLanguageWithTranslation(lang, element);
                        log('✅ Called TopikoTranslations.selectLanguageWithTranslation successfully');
                    } catch (error) {
                        log(`❌ Error calling TopikoTranslations.selectLanguageWithTranslation: ${error.message}`);
                    }
                } else {
                    log('❌ TopikoTranslations.selectLanguageWithTranslation not found');
                }
                
                // Try setting language directly
                if (window.TopikoTranslations.setLanguage) {
                    log('✅ Found TopikoTranslations.setLanguage');
                    const success = window.TopikoTranslations.setLanguage(lang);
                    log(`Language set: ${success ? '✅ SUCCESS' : '❌ FAILED'}`);
                    
                    // Update translations
                    if (window.TopikoTranslations.updatePageTranslations) {
                        window.TopikoTranslations.updatePageTranslations();
                        log('✅ Called updatePageTranslations');
                    }
                }
            } else {
                log('❌ TopikoTranslations not found');
            }
            
            // Update UI
            document.querySelectorAll('.language-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            element.classList.add('selected');
            
            // Check if translations were applied
            setTimeout(() => {
                const testElement = document.querySelector('[data-translate="welcome.tagline"]');
                if (testElement) {
                    const text = testElement.textContent;
                    if (text && text !== 'Welcome tagline will appear here') {
                        log(`✅ Translation applied: ${text.substring(0, 50)}...`);
                        statusElement.textContent = '✅ Translation system working!';
                        statusElement.className = 'status success';
                    } else {
                        log('❌ Translation not applied');
                    }
                }
            }, 500);
        }
        
        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            log('========== PAGE LOADED ==========');
            
            // Check what's available
            log(`typeof selectLanguageWithTranslation: ${typeof selectLanguageWithTranslation}`);
            log(`typeof window.selectLanguageWithTranslation: ${typeof window.selectLanguageWithTranslation}`);
            log(`typeof TopikoTranslations: ${typeof window.TopikoTranslations}`);
            
            if (window.TopikoTranslations) {
                log('Available functions in TopikoTranslations:');
                Object.keys(window.TopikoTranslations).forEach(key => {
                    if (typeof window.TopikoTranslations[key] === 'function') {
                        log(`  - ${key}`);
                    }
                });
                
                // Initialize
                if (window.TopikoTranslations.initializeTranslations) {
                    window.TopikoTranslations.initializeTranslations();
                    log('✅ Initialized translations');
                }
                
                // Make function globally available if needed
                if (!window.selectLanguageWithTranslation && window.TopikoTranslations.selectLanguageWithTranslation) {
                    window.selectLanguageWithTranslation = window.TopikoTranslations.selectLanguageWithTranslation;
                    log('✅ Made selectLanguageWithTranslation globally available');
                }
            }
            
            statusElement.textContent = 'Ready - Click a language to test';
            statusElement.className = 'status';
        });
    </script>
</body>
</html>
