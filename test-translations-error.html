<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Translations Loading</title>
    <style>
        body {
            font-family: monospace;
            padding: 2rem;
            background: #1f2937;
            color: #10b981;
        }
        .error {
            color: #ef4444;
        }
        .success {
            color: #10b981;
        }
        .warning {
            color: #f59e0b;
        }
    </style>
</head>
<body>
    <h1>Testing Translations.js Loading</h1>
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        
        function log(message, type = '') {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            output.appendChild(div);
            console.log(message);
        }
        
        // Catch any errors
        window.addEventListener('error', function(e) {
            log(`❌ Error: ${e.message} at ${e.filename}:${e.lineno}:${e.colno}`, 'error');
        });
        
        log('📋 Starting test...');
        log(`window.TopikoTranslations before loading: ${typeof window.TopikoTranslations}`);
    </script>
    
    <!-- Load translations.js -->
    <script src="translations.js" 
            onload="log('✅ translations.js loaded successfully', 'success')"
            onerror="log('❌ translations.js failed to load', 'error')"></script>
    
    <script>
        // Check immediately after script tag
        log(`window.TopikoTranslations after script tag: ${typeof window.TopikoTranslations}`);
        
        // Check after DOM ready
        document.addEventListener('DOMContentLoaded', function() {
            log('🔄 DOM Content Loaded');
            log(`window.TopikoTranslations at DOMContentLoaded: ${typeof window.TopikoTranslations}`);
            
            if (window.TopikoTranslations) {
                log('✅ TopikoTranslations is available!', 'success');
                log(`Properties: ${Object.keys(window.TopikoTranslations).join(', ')}`);
                log(`TRANSLATIONS languages: ${Object.keys(window.TopikoTranslations.TRANSLATIONS || {}).join(', ')}`);
            } else {
                log('❌ TopikoTranslations is NOT available', 'error');
            }
        });
        
        // Check after delay
        setTimeout(() => {
            log('⏰ Checking after 1 second...');
            log(`window.TopikoTranslations after 1s: ${typeof window.TopikoTranslations}`);
            
            if (window.TopikoTranslations) {
                log('✅ TopikoTranslations found after delay', 'success');
                
                // Try to use it
                try {
                    const lang = window.TopikoTranslations.getCurrentLanguage();
                    log(`Current language: ${lang}`, 'success');
                    
                    const translation = window.TopikoTranslations.getTranslation('welcome.tagline');
                    log(`Test translation: ${translation ? translation.substring(0, 50) + '...' : 'NOT FOUND'}`, 'success');
                } catch (e) {
                    log(`Error using TopikoTranslations: ${e.message}`, 'error');
                }
            }
        }, 1000);
        
        // Check after longer delay
        setTimeout(() => {
            log('⏰ Final check after 3 seconds...');
            log(`window.TopikoTranslations after 3s: ${typeof window.TopikoTranslations}`);
        }, 3000);
    </script>
</body>
</html>
