<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translation System Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 2rem;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        h1 {
            color: #6366f1;
            text-align: center;
        }
        .language-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin: 2rem 0;
        }
        button {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #1e293b;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button.active {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
        }
        .test-section {
            margin: 2rem 0;
            padding: 1rem;
            background: #f8fafc;
            border-radius: 8px;
        }
        .test-item {
            margin: 1rem 0;
            padding: 0.5rem;
            background: white;
            border-radius: 4px;
        }
        .label {
            font-weight: 600;
            color: #64748b;
            font-size: 0.875rem;
        }
        .value {
            margin-top: 0.25rem;
            color: #1e293b;
        }
        .console-output {
            background: #1e293b;
            color: #10b981;
            padding: 1rem;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 2rem;
        }
        .console-line {
            margin: 0.25rem 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Translation System Test</h1>
        
        <div class="language-buttons">
            <button onclick="testLanguage('en')" id="btn-en">English</button>
            <button onclick="testLanguage('hi')" id="btn-hi">हिन्दी</button>
            <button onclick="testLanguage('te')" id="btn-te">తెలుగు</button>
            <button onclick="testLanguage('ta')" id="btn-ta">தமிழ்</button>
        </div>

        <div class="test-section">
            <h2>Current Language: <span id="current-lang">en</span></h2>
            
            <div class="test-item">
                <div class="label">Welcome Tagline:</div>
                <div class="value" id="test-welcome" data-translate="welcome.tagline">Loading...</div>
            </div>
            
            <div class="test-item">
                <div class="label">Try Free Button:</div>
                <div class="value" id="test-button" data-translate="welcome.tryFreeButton">Loading...</div>
            </div>
            
            <div class="test-item">
                <div class="label">Goals Title:</div>
                <div class="value" id="test-goals" data-translate="goals.title">Loading...</div>
            </div>
            
            <div class="test-item">
                <div class="label">Registration Title:</div>
                <div class="value" id="test-registration" data-translate="registration.title">Loading...</div>
            </div>
            
            <div class="test-item">
                <div class="label">Email Label:</div>
                <div class="value" id="test-email" data-translate="registration.fields.email.label">Loading...</div>
            </div>
            
            <div class="test-item">
                <div class="label">Business Name Label:</div>
                <div class="value" id="test-business" data-translate="registration.fields.businessName.label">Loading...</div>
            </div>
        </div>

        <div class="console-output" id="console">
            <div class="console-line">Console output will appear here...</div>
        </div>
    </div>

    <!-- Load the translation system -->
    <script src="translations.js"></script>
    
    <script>
        const consoleDiv = document.getElementById('console');
        
        // Override console.log to display in our div
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            const line = document.createElement('div');
            line.className = 'console-line';
            line.textContent = '> ' + args.join(' ');
            consoleDiv.appendChild(line);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        };

        // Test function
        function testLanguage(lang) {
            console.log(`\n🔄 Testing language: ${lang}`);
            
            // Update button states
            document.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${lang}`).classList.add('active');
            
            // Check if translations are loaded
            if (typeof window.TopikoTranslations === 'undefined') {
                console.log('❌ TopikoTranslations not loaded!');
                return;
            }
            
            console.log('✅ TopikoTranslations loaded');
            
            // Check if language exists
            if (!window.TopikoTranslations.TRANSLATIONS[lang]) {
                console.log(`❌ Language ${lang} not found in TRANSLATIONS`);
                console.log('Available languages:', Object.keys(window.TopikoTranslations.TRANSLATIONS));
                return;
            }
            
            console.log(`✅ Language ${lang} exists`);
            
            // Set language
            const success = window.TopikoTranslations.setLanguage(lang);
            console.log(`Language set: ${success ? 'SUCCESS' : 'FAILED'}`);
            
            // Update current language display
            document.getElementById('current-lang').textContent = window.TopikoTranslations.getCurrentLanguage();
            
            // Test individual translations
            console.log('\n📝 Testing translations:');
            
            const testKeys = [
                'welcome.tagline',
                'welcome.tryFreeButton',
                'goals.title',
                'registration.title',
                'registration.fields.email.label',
                'registration.fields.businessName.label'
            ];
            
            testKeys.forEach(key => {
                const translation = window.TopikoTranslations.getTranslation(key);
                console.log(`${key}: ${translation ? '✅' : '❌'} ${translation ? translation.substring(0, 50) + '...' : 'NOT FOUND'}`);
            });
            
            // Update page translations
            console.log('\n🔄 Updating page translations...');
            window.TopikoTranslations.updatePageTranslations();
            
            console.log('✅ Test complete');
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Translation Test Page Ready');
            
            // Check if translations loaded
            if (typeof window.TopikoTranslations !== 'undefined') {
                console.log('✅ Translation system loaded');
                console.log('Available languages:', Object.keys(window.TopikoTranslations.TRANSLATIONS));
                
                // Test English by default
                testLanguage('en');
            } else {
                console.log('❌ Translation system not loaded!');
            }
        });
    </script>
</body>
</html>
